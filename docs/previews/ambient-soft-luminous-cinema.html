<!DOCTYPE html>
<html lang="zh-CN" class="dark" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>预览 · Hero 实帧对齐（优化）</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { font-family: "Segoe UI", system-ui, sans-serif; min-height: 100vh; }
    html.dark body { background: #0c1a1c; color: #e2e8f0; }
    html.light body { background: #3d2690; color: #f8fafc; }

    .world { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
    html.light #world-dark { display: none; }
    html.dark #world-light { display: none; }

    @keyframes moon { 0%,100%{transform:scale(1);opacity:.75} 50%{transform:scale(1.03);opacity:1} }
    @keyframes ca { 0%,100%{transform:translateX(0);opacity:.5} 50%{transform:translateX(1.8vw);opacity:.8} }
    @keyframes cb { 0%,100%{transform:translateX(0);opacity:.4} 50%{transform:translateX(-1.4vw);opacity:.65} }
    @keyframes ring { 0%,100%{transform:scale(1);opacity:.7} 50%{transform:scale(1.04);opacity:.95} }
    @keyframes rise { 0%{transform:translateY(10vh);opacity:0} 20%{opacity:.45} 100%{transform:translateY(-100vh);opacity:0} }

    #world-dark .base {
      position:absolute; inset:0;
      background: linear-gradient(180deg, #0c1a1c 0%, #1a3034 32%, #2a4e4f 58%, #1a3536 82%, #0f2224 100%);
    }
    #world-dark .moon {
      position:absolute; right:8%; top:6%; width:min(36vh,320px); height:min(36vh,320px); border-radius:50%;
      background: radial-gradient(circle at 48% 48%, rgba(230,240,210,.5) 0%, rgba(151,182,152,.22) 26%, rgba(77,124,119,.08) 50%, transparent 72%);
      animation: moon 12s ease-in-out infinite;
    }
    #world-dark .haze {
      position:absolute; right:-5%; top:-5%; width:75vw; height:75vh;
      background: radial-gradient(ellipse 55% 50% at 55% 40%, rgba(151,182,152,.12), rgba(57,100,100,.07) 40%, transparent 68%);
    }
    #world-dark .cloud {
      position:absolute; left:-8%; width:116%; filter:blur(20px); animation: ca 14s ease-in-out infinite;
    }
    #world-dark .c1 { top:20%; height:18vh;
      background: linear-gradient(90deg, transparent, rgba(45,82,84,.42) 22%, rgba(77,124,119,.28) 50%, rgba(42,78,81,.38) 78%, transparent); }
    #world-dark .c2 { top:38%; height:14vh; animation-name: cb;
      background: linear-gradient(90deg, transparent, rgba(32,57,59,.48) 30%, rgba(57,100,100,.28) 58%, transparent); }
    #world-dark .lamps {
      position:absolute; inset-x:12%; bottom:24%; height:2px;
      background: linear-gradient(90deg, transparent, rgba(212,168,75,.14) 15%, rgba(212,168,75,.08) 50%, rgba(212,168,75,.14) 85%, transparent);
      filter: blur(3px);
    }
    #world-dark .floor {
      position:absolute; inset-x:0; bottom:0; height:36vh;
      background: linear-gradient(to top, rgba(9,24,26,.72), rgba(22,45,43,.28) 45%, transparent);
    }
    #world-dark .vig {
      position:absolute; inset:0;
      background: radial-gradient(ellipse 130% 100% at 50% 42%, transparent 58%, rgba(8,24,26,.32) 100%);
    }

    #world-light .base {
      position:absolute; inset:0;
      background: linear-gradient(180deg, #523088 0%, #4530a0 30%, #5540b0 55%, #3a2480 80%, #2c1468 100%);
    }
    #world-light .lift {
      position:absolute; inset:0;
      background: radial-gradient(ellipse 90% 70% at 50% 45%, rgba(100,87,185,.35), transparent 65%);
    }
    #world-light .ring {
      position:absolute; right:10%; top:4%; width:min(48vh,420px); height:min(48vh,420px);
      background: radial-gradient(circle, rgba(255,248,240,.7) 0%, rgba(255,210,180,.4) 14%, rgba(255,150,110,.18) 30%, rgba(130,90,200,.1) 50%, transparent 68%);
      animation: ring 11s ease-in-out infinite;
    }
    #world-light .veil {
      position:absolute; inset:0;
      background: linear-gradient(125deg, transparent 20%, rgba(100,150,255,.12) 40%, transparent 55%, rgba(160,100,220,.1) 70%, transparent 85%);
      filter: blur(32px);
    }
    #world-light .teal-l {
      position:absolute; left:-8%; bottom:-8%; width:55vw; height:48vh;
      background: radial-gradient(ellipse 60% 50% at 40% 70%, rgba(0,230,190,.14), rgba(60,180,255,.08) 40%, transparent 70%);
    }
    #world-light .teal-r {
      position:absolute; right:0; bottom:-5%; width:42vw; height:40vh;
      background: radial-gradient(ellipse 55% 45% at 50% 75%, rgba(0,200,255,.1), transparent 65%);
    }
    #world-light .floor {
      position:absolute; inset-x:0; bottom:0; height:34vh;
      background: linear-gradient(to top, rgba(34,0,88,.55), rgba(70,40,130,.22) 50%, transparent);
    }
    #world-light .vig {
      position:absolute; inset:0;
      background: radial-gradient(ellipse 120% 100% at 50% 42%, transparent 55%, rgba(40,10,90,.28) 100%);
    }

    .bubbles { position:absolute; inset:0; }
    .bubble {
      position:absolute; bottom:0; border-radius:50%;
      border:1px solid rgba(151,182,152,.35);
      animation: rise linear infinite;
    }
    html.light .bubble { border-color: rgba(180,140,255,.35); }
    @keyframes rise {
      0% { transform: translateY(10vh); opacity: 0; }
      20% { opacity: .4; }
      100% { transform: translateY(-100vh); opacity: 0; }
    }

    .ref {
      position: fixed; left: 12px; bottom: 12px; z-index: 2;
      display: flex; gap: 8px;
    }
    .ref .cap { position: relative; }
    .ref img {
      width: 132px; height: 74px; object-fit: cover; border-radius: 8px;
      border: 2px solid rgba(255,255,255,.4); box-shadow: 0 4px 16px rgba(0,0,0,.45);
    }
    .ref span {
      position: absolute; left: 4px; bottom: 4px; font-size: 9px;
      background: rgba(0,0,0,.55); color: #fff; padding: 1px 5px; border-radius: 4px;
    }

    .ui {
      position: relative; z-index: 1; max-width: 540px; margin: 0 auto;
      padding: 1.75rem 1.25rem 6.5rem;
    }
    .badge {
      display: inline-block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
      padding: .35rem .75rem; border-radius: 999px; margin-bottom: .7rem;
      border: 1px solid rgba(151,182,152,.45); color: #97b698;
    }
    html.light .badge { border-color: rgba(230,202,202,.5); color: #e6caca; }
    h1 { font-size: 1.35rem; margin: 0 0 .4rem; font-weight: 650; }
    .lead { opacity: .88; font-size: .9rem; line-height: 1.55; margin: 0 0 1rem; }
    .toolbar { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1rem; }
    button {
      border: 1px solid rgba(255,255,255,.28); background: rgba(0,0,0,.32);
      color: inherit; border-radius: 999px; padding: .5rem 1rem; cursor: pointer; font-size: .85rem;
      backdrop-filter: blur(10px);
    }
    button.active { border-color: #97b698; color: #97b698; }
    html.light button.active { border-color: #e6caca; color: #e6caca; }
    .card {
      background: rgba(0,0,0,.28); border: 1px solid rgba(255,255,255,.14);
      border-radius: 1rem; padding: 1rem; margin-bottom: .7rem; backdrop-filter: blur(14px);
    }
    .card h2 { font-size: .88rem; margin: 0 0 .35rem; }
    .card li, .card p { font-size: .84rem; opacity: .9; line-height: 1.5; margin: 0; }
    .card ul { margin: 0; padding-left: 1.1rem; }
    .swatches { display: flex; gap: 6px; margin-top: .45rem; }
    .sw { width: 26px; height: 26px; border-radius: 6px; border: 1px solid rgba(255,255,255,.3); }
  </style>
</head>
<body>
  <div class="world" id="world-dark">
    <div class="base"></div>
    <div class="moon"></div>
    <div class="haze"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="lamps"></div>
    <div class="floor"></div>
    <div class="vig"></div>
    <div class="bubbles" id="b-dark"></div>
  </div>
  <div class="world" id="world-light">
    <div class="base"></div>
    <div class="lift"></div>
    <div class="ring"></div>
    <div class="veil"></div>
    <div class="teal-l"></div>
    <div class="teal-r"></div>
    <div class="floor"></div>
    <div class="vig"></div>
    <div class="bubbles" id="b-light"></div>
  </div>

  <div class="ref">
    <div class="cap"><img src="frames/moonlit-08.jpg" alt="" /><span>月夜视频帧</span></div>
    <div class="cap"><img src="frames/deer-05.jpg" alt="" /><span>鹿境视频帧</span></div>
  </div>

  <div class="ui">
    <div class="badge" id="badge">深色 · 月夜云海</div>
    <h1>再优化：更贴视频、更干净</h1>
    <p class="lead">
      色板仍来自 Hero 实帧；层数收紧、中间更透，玻璃卡片更好读。左下角对照真实截帧。
    </p>
    <div class="toolbar">
      <button type="button" class="active" id="btn-dark" onclick="setMode('dark')">深色 · 月夜</button>
      <button type="button" id="btn-light" onclick="setMode('light')">浅色 · 鹿境</button>
    </div>
    <div class="card">
      <h2 id="t">暗色采样</h2>
      <div class="swatches" id="sw"></div>
      <p id="d" style="margin-top:.45rem"></p>
    </div>
    <div class="card">
      <h2>本轮优化</h2>
      <ul>
        <li>月亮/环日更柔，少硬边</li>
        <li>云带更贴视频分层，中间区域更透</li>
        <li>鹿境去掉脏 conic，改柔和帷幕光</li>
        <li>Hero 加载占位与遮罩也改为同色板</li>
      </ul>
    </div>
  </div>

  <script>
    var P = {
      dark: {
        badge: '深色 · 月夜云海',
        t: '暗色采样（视频帧）',
        d: '夜空青绿 · 黄绿月光 · 横向云海 · 近地暗绿',
        c: ['#09181a','#1a3034','#2a4e4f','#4d7c77','#97b698']
      },
      light: {
        badge: '浅色 · 奇幻鹿境',
        t: '亮色采样（视频帧）',
        d: '紫穹 · 暖环日 · 蓝紫帷幕 · 地面青绿光',
        c: ['#2c1468','#4b2fa4','#6457b9','#e6caca','#00e6be']
      }
    };
    function setMode(mode) {
      document.documentElement.classList.remove('light','dark');
      document.documentElement.classList.add(mode);
      document.getElementById('btn-dark').classList.toggle('active', mode==='dark');
      document.getElementById('btn-light').classList.toggle('active', mode==='light');
      var p = P[mode];
      document.getElementById('badge').textContent = p.badge;
      document.getElementById('t').textContent = p.t;
      document.getElementById('d').textContent = p.d;
      var box = document.getElementById('sw');
      box.innerHTML = '';
      p.c.forEach(function(c){ var s=document.createElement('div'); s.className='sw'; s.style.background=c; box.appendChild(s); });
    }
    window.setMode = setMode;
    setMode('dark');
    function bubbles(id,n){
      var el=document.getElementById(id);
      for(var i=0;i<n;i++){
        var b=document.createElement('div'); b.className='bubble';
        var s=4+Math.random()*9;
        b.style.width=s+'px'; b.style.height=s+'px';
        b.style.left=12+Math.random()*76+'%';
        b.style.animationDuration=9+Math.random()*8+'s';
        b.style.animationDelay=(-Math.random()*10)+'s';
        el.appendChild(b);
      }
    }
    bubbles('b-dark',6); bubbles('b-light',7);
  </script>
</body>
</html>
