[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "my-awesome-blog"
version = "1.0.0"
description = "My Awesome Blog - A modern personal blog platform with AI features"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

[tool.mypy]
# Python 版本
python_version = "3.12"

# 严格模式
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_no_return = true
warn_unreachable = true

# 禁用一些过于严格的规则（逐步启用）
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = false  # FastAPI 装饰器可能有问题
disallow_subclassing_any = false     # SQLAlchemy 继承可能有问题

# 忽略缺失的导入（第三方库可能没有类型存根）
ignore_missing_imports = true

# 显式忽略某些模块
[[tool.mypy.overrides]]
module = [
    "psycopg2.*",
    "redis.*",
    "alembic.*",
    "tenacity.*",
    "httpx.*",
    "oss2.*",
    "apscheduler.*",
]
ignore_missing_imports = true

# 排除路径
exclude = [
    "migrations/",
    "alembic/",
    "venv/",
    ".venv/",
    "__pycache__/",
    ".pytest_cache/",
    "tests/",
]

# 显示错误上下文
show_error_codes = true
show_column_numbers = true
show_error_context = true

# 美化输出
pretty = true

# 缓存
incremental = true
cache_dir = ".mypy_cache"

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | migrations
  | alembic
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip = ["migrations", "alembic", "venv"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["app/tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
