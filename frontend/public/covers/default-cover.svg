<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c4a6e"/>
      <stop offset="0.55" stop-color="#075985"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>

  <!-- 顶部天光 -->
  <ellipse cx="840" cy="120" rx="340" ry="150" fill="#7dd3fc" opacity="0.12"/>
  <!-- 月光海路 -->
  <rect x="780" y="150" width="120" height="380" fill="url(#glow)" opacity="0.5"/>

  <!-- 波纹线条 -->
  <g stroke="url(#wave)" stroke-width="2" fill="none">
    <path d="M0 480 Q 150 440 300 480 T 600 480 T 900 480 T 1200 480"/>
    <path d="M0 520 Q 150 485 300 520 T 600 520 T 900 520 T 1200 520" opacity="0.7"/>
    <path d="M0 560 Q 150 530 300 560 T 600 560 T 900 560 T 1200 560" opacity="0.45"/>
  </g>

  <!-- 气泡点缀 -->
  <g fill="#bae6fd">
    <circle cx="220" cy="300" r="5" opacity="0.5"/>
    <circle cx="260" cy="250" r="3" opacity="0.4"/>
    <circle cx="980" cy="360" r="4" opacity="0.45"/>
    <circle cx="1010" cy="310" r="2.5" opacity="0.35"/>
    <circle cx="540" cy="200" r="3.5" opacity="0.4"/>
  </g>

  <!-- 中央标记 -->
  <g transform="translate(600,330)" text-anchor="middle">
    <circle r="46" fill="none" stroke="#7dd3fc" stroke-opacity="0.7" stroke-width="2"/>
    <circle r="34" fill="none" stroke="#7dd3fc" stroke-opacity="0.35" stroke-width="1.5"/>
    <path d="M -14 8 L 0 -14 L 14 8" fill="none" stroke="#bae6fd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -14 20 L 0 -2 L 14 20" fill="none" stroke="#bae6fd" stroke-opacity="0.6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="600" y="600" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" letter-spacing="10" fill="#bae6fd" fill-opacity="0.75">MY AWESOME BLOG</text>
</svg>
