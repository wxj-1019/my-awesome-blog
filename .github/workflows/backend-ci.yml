name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # 与生产 Dockerfile (python:3.12-slim) 对齐
        python-version: ['3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run tests
        working-directory: ./backend
        # 仅收集 app/tests（根目录 test_*.py 为手工脚本，勿进 CI）
        # conftest 默认 SQLite 内存库 + create_all
        run: pytest app/tests -v --cov=app --cov-report=xml
        env:
          # 故意不注入 postgres URL，让 conftest setdefault 使用 sqlite:///:memory:
          SECRET_KEY: test-secret-key-for-ci-min-32-chars-long
          DEBUG: "True"
          EMAIL_ENABLED: "false"
          FRONTEND_URL: http://localhost:3000
          BACKEND_CORS_ORIGINS: '["http://localhost:3000"]'

      - name: Upload coverage to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml
          flags: backend
          name: codecov-backend
